name: 3D Contribution Skyline

# Was schedule-only, so it had never run — which is why
# ./profile-3d-contrib/profile-night-rainbow.svg 404'd in the README.
# push + workflow_dispatch make it render on the very first commit.

on:
  schedule:
    - cron: "30 18 * * *"     # 00:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Renders the whole set: night-rainbow, night-view, season-animate,
          # gitblock, etc. The README picks night-rainbow.
          SETTING_JSON: ""

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore(3d): regenerate contribution skyline"
          git push
