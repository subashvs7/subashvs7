name: 3D Contribution Skyline

# Was schedule-only, so it had never run — which is why
# ./profile-3d-contrib/profile-night-rainbow.svg 404'd in the README.
# push + workflow_dispatch make it render on the very first commit.

# DORMANT. The README no longer shows the skyline -- with ~2 public events
# the render is a near-flat plane. Left in place (manual trigger only) so it
# can be switched back on if public activity picks up.
# Safe to delete this file, plus the profile-3d-contrib/ folder, if you'd rather.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Renders the whole set: night-rainbow, night-view, season-animate,
          # gitblock, etc. The README picks night-rainbow.
          SETTING_JSON: ""

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore(3d): regenerate contribution skyline"
          git push
