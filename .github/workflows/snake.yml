name: Generate Snake Animation

# DORMANT. The README no longer shows the snake -- with ~2 public events the
# grid rendered empty. Left in place (manual trigger only) so it can be
# switched back on if public activity picks up: re-add the schedule/push
# triggers below and put the <picture> block back in README.md.
# Safe to delete this file, plus the "output" branch, if you'd rather.

on:
  workflow_dispatch:            # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3.5.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Light + dark are both emitted so the README can swap them
          # with <picture> / prefers-color-scheme.
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
