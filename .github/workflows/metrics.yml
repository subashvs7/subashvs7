name: Profile Metrics

# DORMANT -- manual trigger only. Nothing in README.md references its output.
#
# Why it was stood down, so this isn't "fixed" by re-enabling it blindly:
#
#   * The public github-readme-stats / trophy / activity-graph services are
#     dead (503 / 402 DEPLOYMENT_DISABLED), which is why panels were being
#     self-hosted here in the first place.
#   * The self-hosted panels then had their own problem: with ~2 public
#     events, the overview / isocalendar / achievements / habits panels
#     rendered as empty grids.
#   * The languages panel was worse than empty. Without a PAT the action
#     sees only THIS repo, so it reported "PowerShell 100%" -- picked up
#     from scripts/gen-social-previews.mjs. Even with a PAT it would only
#     count public repos, and the real work (SAS, Proman, PSS Transport,
#     Meenachi Express) is private, so the number would still mislead.
#
# The README uses a curated skillicons stack instead, which is accurate.
#
# If public activity grows and you want these back: add METRICS_TOKEN (see
# SETUP.md), restore the schedule/push triggers, and re-add the <img> to
# README.md. Keep output_action: commit -- with "none" the SVG lands in
# /metrics_renders/ inside the container, never in the workspace, so a
# follow-up `git add assets` finds nothing and the step fails.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Languages panel
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: subashvs7
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: "0:8B5CF6, 1:F0ABFC, 2:C4B5FD, 3:60A5FA"
          plugin_languages_details: bytes-size, percentage
          output_action: commit
          output_condition: changed
          plugins_errors_fatal: no
          retries: 3
